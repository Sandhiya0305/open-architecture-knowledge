site_name: Open Architecture Knowledge
site_description: Clear, practical and source-backed software architecture guidance.
site_url: https://sandhiya0305.github.io/open-architecture-knowledge/
repo_url: https://github.com/Sandhiya0305/open-architecture-knowledge
repo_name: Sandhiya0305/open-architecture-knowledge

theme:
  name: material
  variant: classic
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Start here:
      - Learning path: learning-path/index.md
      - Foundations: fundamentals/index.md
      - Glossary: glossary.md
  - Architecture patterns:
      - Overview: architectures/index.md
      - Layered architecture: architectures/layered.md
      - Modular monolith: architectures/modular-monolith.md
      - Microservices: architectures/microservices.md
      - Clean Architecture: architectures/clean-architecture.md
      - Event-driven architecture: architectures/event-driven.md
  - Frameworks and libraries:
      - Overview: technologies/index.md
      - Java: technologies/java.md
      - Python: technologies/python.md
      - Node.js and TypeScript: technologies/nodejs.md
      - PHP: technologies/php.md
      - Cross-stack tools: technologies/cross-stack.md
      - Catalogue review log: technologies/review-log.md
  - Engineering decisions:
      - Choosing an architecture: comparisons/choosing-an-architecture.md
      - Quality attributes: fundamentals/quality-attributes.md
      - Architecture vs frameworks: fundamentals/architecture-vs-framework.md
      - Decision process: fundamentals/decision-process.md
  - Reviewed research candidates: research-candidates/index.md
  - About:
      - About OAI: about/index.md
      - Documentation license: licensing.md
      - Contributing: about/contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra_javascript:
  - javascripts/mermaid-init.js

strict: true
