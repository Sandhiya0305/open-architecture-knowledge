name: Build and deploy knowledge website

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "CONTRIBUTING.md"
      - ".markdownlint-cli2.jsonc"
      - ".lychee.toml"
      - ".codespellrc"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "CONTRIBUTING.md"
      - ".markdownlint-cli2.jsonc"
      - ".lychee.toml"
      - ".codespellrc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out knowledge repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked documentation dependencies
        run: uv sync --locked --all-groups

      - name: Spell check
        run: uv run codespell docs README.md CONTRIBUTING.md

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.24.1 "docs/**/*.md" README.md CONTRIBUTING.md

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --verbose --no-progress --config .lychee.toml README.md CONTRIBUTING.md docs

      - name: Check Zensical migration compatibility
        run: uv run zensical build --strict

      - name: Build production website with MkDocs Material
        run: uv run mkdocs build --strict --site-dir site-mkdocs

      - name: Upload production website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site-mkdocs

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
